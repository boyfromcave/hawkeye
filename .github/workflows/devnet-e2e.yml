# Hawkeye beside a real node, on both node lines (ycash-dd v4.5.0, ycash6 6.2x) and on both
# bridges (foreign = ethereum: anvil + wYEC; foreign = near: a NEAR sandbox node + wyec-near, NEAR
# plan NH5): build the node from the line's upgrade/vault branch, start the devnet (regtest nodes +
# the bridge + one Hawkeye per attestor) and run `scenario demo` and the optimistic-mint drill
# `scenario rogue-mint` (lock -> mint, burn -> HKB1/HKN1 intent -> release, rogue -> cancel ->
# slash, supply invariant).
# This is the plan's §9 success criterion as a repeatable job; the mock never counts toward it.
#
# Slow (a cold node build is ~1 h), so it runs nightly, on demand, and when devnet/ or the
# daemon changes on main. The node build is cached per node commit.
name: devnet-e2e

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      node_ref:
        description: node branch, tag or commit to build (both lines)
        default: upgrade/vault
  push:
    branches: [main, "claude/**"]
    paths: ["devnet/**", "crates/**", "eth/**", "near/**", ".github/workflows/devnet-e2e.yml"]

permissions:
  contents: read

concurrency:
  group: devnet-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FOUNDRY_VERSION: v1.7.1
  NODE_REF: ${{ inputs.node_ref || 'upgrade/vault' }}

jobs:
  # The node binaries per line, built on ubuntu-22.04 (the depends toolchain needs libtinfo5) and
  # cached per line + node commit; the demo jobs restore them from that cache. They link only libc,
  # libm and libgcc_s, so the NEAR jobs run them on ubuntu-24.04 (the sandbox needs glibc 2.39).
  node:
    name: node ${{ matrix.line }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: ycash-dd
            repo: boyfromcave/ycash-dd
            daemon: src/ycashd
            cli: src/ycash-cli
          - line: ycash6
            repo: boyfromcave/ycash6
            daemon: src/ycashd
            cli: src/ycash-cli
    steps:
      # Only the node is checked out here: its depends step runs `cargo vendor`, which would find
      # Hawkeye's workspace manifest (resolver 3) above the node and fail with the node's cargo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ env.NODE_REF }}
          path: node
          persist-credentials: false
      - name: node commit
        id: node
        working-directory: node
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: cached node binaries
        id: bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node-bin
          key: node-bin-${{ matrix.line }}-${{ steps.node.outputs.sha }}
      - name: build prerequisites
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 zlib1g-dev curl bsdmainutils \
            automake libtinfo5
      - name: cached depends
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node/depends/x86_64-pc-linux-gnu
            node/depends/built
            node/depends/sources
          key: depends-${{ matrix.line }}-${{ hashFiles('node/depends/Makefile', 'node/depends/funcs.mk', 'node/depends/config.site.in', 'node/depends/packages/**', 'node/depends/patches/**', 'node/depends/hosts/**', 'node/depends/builders/**') }}
      - name: build the node (unmodified src/)
        if: steps.bin.outputs.cache-hit != 'true'
        working-directory: node
        env:
          LINE: ${{ matrix.line }}
          DAEMON: ${{ matrix.daemon }}
          CLI: ${{ matrix.cli }}
        run: |
          BUILD_STAGE=depends ./zcutil/build.sh -j"$(nproc)"
          host=$(./depends/config.guess)
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/$host/share/config.site" ./configure
          if [ "$LINE" = ycash6 ]; then
            # 6.20.0: a targeted make skips BUILT_SOURCES, so generate the cxxbridge headers first.
            mapfile -t headers < <(sed -n '/^CXXBRIDGE_H = /,/bridge.h$/p' src/Makefile.am | grep -o 'rust/gen/include/[^ \\]*')
            make -C src -j"$(nproc)" "${headers[@]}"
          fi
          make -C src -j"$(nproc)" "$(basename "$DAEMON")" "$(basename "$CLI")"
          mkdir -p ../node-bin
          cp "$DAEMON" "$CLI" ../node-bin/

  demo:
    name: demo on ${{ matrix.line }} (${{ matrix.foreign }})
    needs: node
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Hawkeye and the node are checked out side by side, never one inside the other (see `node`).
    defaults:
      run:
        working-directory: hawkeye
    strategy:
      fail-fast: false
      matrix:
        line: [ycash-dd, ycash6]
        foreign: [ethereum, near]
        include:
          - line: ycash-dd
            repo: boyfromcave/ycash-dd
            daemon: src/ycashd
            cli: src/ycash-cli
          - line: ycash6
            repo: boyfromcave/ycash6
            daemon: src/ycashd
            cli: src/ycash-cli
          - foreign: ethereum
            runner: ubuntu-22.04
          # the pinned NEAR sandbox (nearcore 2.13.4) needs glibc >= 2.39
          - foreign: near
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hawkeye
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ env.NODE_REF }}
          path: node
          persist-credentials: false
      - name: node commit
        id: node
        working-directory: node
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: node binaries (from the node job)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node-bin
          key: node-bin-${{ matrix.line }}-${{ steps.node.outputs.sha }}
          fail-on-cache-miss: true
      - name: zk parameters
        if: matrix.line == 'ycash-dd'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: params
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('node/zcutil/fetch-params.sh') }}
      - name: fetch zk parameters
        if: matrix.line == 'ycash-dd' && steps.params.outputs.cache-hit != 'true'
        working-directory: node
        run: ./zcutil/fetch-params.sh
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        if: matrix.foreign == 'ethereum'
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.foreign == 'ethereum'
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: devnet-${{ matrix.foreign }}
          workspaces: |
            hawkeye -> target
            hawkeye/near -> target
      - name: build hawkeye
        run: cargo build --locked --bin hawkeye
      - name: contracts
        if: matrix.foreign == 'ethereum'
        working-directory: hawkeye/eth
        run: |
          npm ci --ignore-scripts
          ./tools/fetch-wyec.sh
      # NEAR: the wyec-near wasm (near/rust-toolchain.toml brings the wasm target), the set-up helper
      # (near-admin: accounts, deploy) and the pinned sandbox node (SHA-256 checked).
      - name: NEAR contract, helper and sandbox
        if: matrix.foreign == 'near'
        run: |
          (cd near && cargo build --locked --target wasm32-unknown-unknown --release)
          cargo build --locked -p hawkeye-near --example near-admin
          bin=$(near/tools/fetch-sandbox.sh)
          "$bin" --version
          echo "NEAR_SANDBOX_BIN=$bin" >>"$GITHUB_ENV"
      - name: scenario demo and rogue-mint
        env:
          DEVNET_NATIVE_SOLC: "1"
          DAEMON: ${{ matrix.daemon }}
          CLI: ${{ matrix.cli }}
          FOREIGN: ${{ matrix.foreign }}
        run: |
          YCASHD="$GITHUB_WORKSPACE/node-bin/$(basename "$DAEMON")"
          YCASH_CLI="$GITHUB_WORKSPACE/node-bin/$(basename "$CLI")"
          export YCASHD YCASH_CLI
          "$YCASHD" -version | head -1
          python3 devnet/hawkeye-devnet scenario demo --fresh --foreign "$FOREIGN"
          python3 devnet/hawkeye-devnet scenario rogue-mint --fresh --foreign "$FOREIGN"
      - name: stop the devnet
        if: always()
        run: python3 devnet/hawkeye-devnet down || true
      - name: transcript and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devnet-${{ matrix.line }}-${{ matrix.foreign }}
          path: |
            hawkeye/devnet/transcripts/
            hawkeye/devnet/run/transcripts/
            hawkeye/devnet/run/**/*.log
          retention-days: 14
          if-no-files-found: warn
