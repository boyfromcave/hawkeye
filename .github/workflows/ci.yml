# Hawkeye CI: every push and pull request.
#
# Rust: format, clippy (-D warnings), unit + integration tests (anvil-backed Ethereum tests
# included), rustdoc (-D warnings), cargo-deny (advisories, licences, bans, sources), coverage,
# and a locked release build uploaded as an artifact.
# Contracts: the Foundry project in eth/ against wyec at its pinned commit (build, sizes, tests,
# deploy script against a local anvil).
# NEAR: the wyec-near contract (unit tests, wasm, near-workspaces sandbox tests) and Hawkeye's NEAR
# adapter against a real NEAR sandbox node (crates/hawkeye-near/tests/sandbox.rs).
# Workflows: actionlint.
# kogany (report-only; a push to or a dispatch on vaults/kogany-compat): the regtest self-signing
# test (crates/hawkeye/tests/regtest_self_signing.rs) against a ycash6 node that a regtest kogany
# node (the third node line, workspace kogany plan W9-c) follows and validates block by block
# (devnet/kogany-rig.py follow): the kogany + ycash6 test rig column. koganyd is kogany's
# koganyd-bin artifact at KOGANY_REF, else built at that commit; ycashd is ycash6's node-bin of
# vaults/kogany-compat.
#
# Every third-party action is pinned to a commit SHA (the tag in the trailing comment); the
# Rust toolchain comes from rust-toolchain.toml; builds are --locked.
name: ci

on:
  push:
    # main, the vault upgrade line (upgrade/vault, the GitHub default) and the post-quantum line
    # (upgrade/quantum-vaults: PQ vault owners, rpcversion 7), vaults/kogany-compat (the kogany
    # work's integration branch, workspace kogany plan section 4.2 rule 0).
    branches: [main, upgrade/vault, upgrade/quantum-vaults, vaults/kogany-compat, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  FOUNDRY_VERSION: v1.7.1

jobs:
  actionlint:
    name: lint workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint and zizmor from PyPI at exact versions (install-action has no actionlint); zizmor
      # hash-locked (contrib/ci/zizmor-requirements.txt). actionlint-py ships as an sdist only.
      - name: install linters
        run: |
          python3 -m pip install --user --disable-pip-version-check --require-hashes --no-deps \
            -r contrib/ci/zizmor-requirements.txt
          python3 -m pip install --user --disable-pip-version-check actionlint-py==1.7.7.23
      - name: actionlint
        run: actionlint -color
      - name: zizmor (workflow security)
        run: zizmor --offline .github/workflows

  devnet-script:
    name: devnet script (compile, help)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m py_compile devnet/hawkeye-devnet
      - run: python3 devnet/hawkeye-devnet --help

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test
      # anvil on PATH turns on hawkeye-eth's integration tests (they skip without it);
      # HAWKEYE_REQUIRE_ANVIL makes a missing anvil a failure here instead of a skip.
      - name: cargo test
        env:
          HAWKEYE_REQUIRE_ANVIL: "1"
        run: |
          anvil --version
          cargo test --workspace --all-features --locked --no-fail-fast

  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: doc
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-llvm-cov
      # hawkeye-core is the consensus-adjacent crate (encodings, policy, matching): plan §9 H1
      # requires >= 90 % line coverage there.
      - name: coverage (workspace report, hawkeye-core gate)
        run: |
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
          cargo llvm-cov report --package hawkeye-core --fail-under-lines 90 --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  build:
    name: release build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
      - run: cargo build --release --locked --bin hawkeye
      - run: ./target/release/hawkeye --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hawkeye-linux-x86_64
          path: target/release/hawkeye
          retention-days: 14

  contracts:
    name: contracts (forge)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci --ignore-scripts
      - run: ./tools/fetch-wyec.sh
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      # The vectors' provenance (audit 05/T-1): Vectors.t.sol stamps vectors/eip712.json with the
      # fetched pin; this is the second, independent witness that stamp, fetch and pin agree.
      - name: vector stamp matches the pin
        run: |
          pin=$(sed -n 's/^WYEC_COMMIT=//p' tools/fetch-wyec.sh)
          test -n "$pin"
          test "$pin" = "$(jq -r .wyecCommit vectors/eip712.json)"
          test "$pin" = "$(cat vendor/wyec/.wyec-commit)"
      # One copy of the contract tests (audit 05/T-4): wyec's suites run from vendor/wyec/test at
      # the pin through test/Upstream.t.sol. Every test function declared upstream, and every one
      # of Hawkeye's own, must be one forge actually lists.
      - name: upstream and Hawkeye test counts
        run: ./tools/check-test-counts.sh
      - name: no bare vm.expectRevert()
        run: |
          if grep -rn "vm.expectRevert();" test/; then
            echo "bare expectRevert is not allowed; assert the selector" >&2
            exit 1
          fi
      - name: committed ABIs match the build (crates/hawkeye-eth/abi)
        run: ./tools/export-abi.sh --check
      - name: deploy script against a local anvil
        run: ./tools/deploy-anvil-smoke.sh

  near-contract:
    name: NEAR contract (wyec-near)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: near
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: near
          workspaces: near
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: unit tests (near-sdk test env, golden vectors shared with hawkeye-core)
        run: cargo test --locked
      - name: wasm build (the flags in near/.cargo/config.toml apply)
        run: |
          cargo build --locked --target wasm32-unknown-unknown --release
          ls -l target/wasm32-unknown-unknown/release/wyec_near.wasm
      - name: sandbox tests on a real NEAR node (near-workspaces downloads the sandbox)
        env:
          NEAR_SANDBOX: "1"
        run: cargo test --locked --features sandbox-install --test sandbox -- --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyec-near-wasm
          path: near/target/wasm32-unknown-unknown/release/wyec_near.wasm
          retention-days: 14

  # The NH4 adapter's RPC shapes against a real nearcore (NEAR plan NH5): the pinned sandbox node
  # (near/tools/fetch-sandbox.sh, SHA-256 checked), the release wasm deployed by the test itself.
  near-adapter-sandbox:
    name: NEAR adapter on a real sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: near-adapter
          workspaces: |
            . -> target
            near -> target
      - name: wasm build
        working-directory: near
        run: cargo build --locked --target wasm32-unknown-unknown --release
      - name: start a NEAR sandbox
        run: |
          bin=$(near/tools/fetch-sandbox.sh)
          "$bin" --version
          home="$RUNNER_TEMP/near-sandbox"
          "$bin" --home "$home" init --fast
          nohup "$bin" --home "$home" run --rpc-addr 127.0.0.1:3030 --network-addr 127.0.0.1:24567 \
            >"$RUNNER_TEMP/near-sandbox.log" 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:3030/status >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3030/status | head -c 400
          echo "HAWKEYE_NEAR_SANDBOX_KEY=$home/validator_key.json" >>"$GITHUB_ENV"
      - name: adapter tests against the sandbox
        env:
          HAWKEYE_NEAR_SANDBOX_RPC: http://127.0.0.1:3030
          HAWKEYE_REQUIRE_NEAR_SANDBOX: "1"
        run: cargo test --locked -p hawkeye-near --test sandbox -- --nocapture
      - name: sandbox log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/near-sandbox.log"

  # The kogany leg (report-only until the lead architect flips it: drop continue-on-error). No
  # cache: koganyd, ycashd and fetch-params.sh are other repositories' code.
  kogany:
    name: kogany (report-only)
    # Cache poisoning (code scanning): a downloaded artifact runs here, so only the repository owner starts it.
    if: (github.ref_name == 'vaults/kogany-compat' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      # kogany vaults/kogany-compat at W5-f (the YED module registered: the real index answers)
      KOGANY_REF: dd834da8b77e882b9e6a00b3ce70f2b30b930c37
      YCASH6_REPO: boyfromcave/ycash6
      YCASH6_BRANCH: vaults/kogany-compat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # koganyd-bin.tgz: koganyd (dev profile, --features ycash, ubuntu-24.04, the runner's librocksdb)
      # and koganyd-bin.json, from a push, schedule or dispatch run of kogany at KOGANY_REF only (the
      # contract of the workspace's docs/plans/kogany/ci-design.md), never a pull_request run.
      - name: kogany's koganyd-bin at KOGANY_REF
        id: koganyd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$KOGANY_REF" in *[!0-9a-f]*|'') echo "::error::KOGANY_REF is not a commit id"; exit 1 ;; esac
          trusted='select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")'
          runs=$(gh run list -R boyfromcave/kogany -c "$KOGANY_REF" -L 50 --json databaseId,event,headSha \
            -q ".[] | select(.headSha == \"$KOGANY_REF\") | $trusted | .databaseId" 2>/dev/null || true)
          for r in $runs; do
            if gh run download "$r" -R boyfromcave/kogany -n koganyd-bin -D "$RUNNER_TEMP/zk-dl" 2>/dev/null \
               && [ -f "$RUNNER_TEMP/zk-dl/koganyd-bin.tgz" ]; then
              mkdir -p "$RUNNER_TEMP/zk" && tar xzf "$RUNNER_TEMP/zk-dl/koganyd-bin.tgz" -C "$RUNNER_TEMP/zk"
              cat "$RUNNER_TEMP/zk/koganyd-bin.json"
              echo "KOGANYD=$RUNNER_TEMP/zk/koganyd" >> "$GITHUB_ENV"
              echo "got=true" >> "$GITHUB_OUTPUT"
              echo "koganyd from boyfromcave/kogany run $r"; exit 0
            fi
          done
          echo "got=false" >> "$GITHUB_OUTPUT"
          echo "no koganyd-bin of boyfromcave/kogany at $KOGANY_REF: building it here"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boyfromcave/kogany
          ref: ${{ env.KOGANY_REF }}
          path: kogany
          persist-credentials: false
          sparse-checkout: ${{ steps.koganyd.outputs.got == 'true' && '.github/actions/setup-zakura-build' || '' }}
      # kogany's setup-zakura-build as its script (librocksdb for koganyd). The fallback build fails at
      # dependency resolution until boyfromcave/zakura-common-ycash exists on GitHub (kogany plan K-2).
      - name: kogany build packages
        env:
          INSTALL_LIBCLANG: "false"
          INSTALL_PROTOC: "false"
        run: bash kogany/.github/actions/setup-zakura-build/install-ubuntu-packages.sh
      - name: build koganyd (kogany at KOGANY_REF, --features ycash)
        if: steps.koganyd.outputs.got != 'true'
        working-directory: kogany
        env:
          CARGO_INCREMENTAL: 0
        run: |
          cargo build --locked -p zakura --features ycash --bin koganyd
          echo "KOGANYD=$GITHUB_WORKSPACE/kogany/target/debug/koganyd" >> "$GITHUB_ENV"
      - name: koganyd runs here
        run: |
          if ldd "$KOGANYD" | grep 'not found'; then echo "::error::koganyd needs a library this runner lacks"; exit 1; fi
          "$KOGANYD" --version
      - name: ycashd from ycash6's node-bin (vaults/kogany-compat)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted='select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")'
          runs=$(gh run list -R "$YCASH6_REPO" -w yellowback-tests.yml -b "$YCASH6_BRANCH" -L 20 --json databaseId,event -q ".[] | $trusted | .databaseId")
          for r in $runs; do
            if gh run download "$r" -R "$YCASH6_REPO" -n node-bin -D "$RUNNER_TEMP/dl" 2>/dev/null; then
              echo "ycashd from $YCASH6_REPO run $r"; break
            fi
          done
          mkdir -p "$RUNNER_TEMP/node"
          tar -xzf "$RUNNER_TEMP/dl/node-bin.tgz" -C "$RUNNER_TEMP/node" src/ycashd src/ycash-cli
          test -x "$RUNNER_TEMP/node/src/ycashd"
          echo "YCASHD=$RUNNER_TEMP/node/src/ycashd" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.YCASH6_REPO }}
          ref: ${{ env.YCASH6_BRANCH }}
          path: ycash6
          persist-credentials: false
          sparse-checkout: zcutil
      - name: fetch zcash params
        run: ycash6/zcutil/fetch-params.sh
      - name: the self-signing regtest test, followed by kogany (report-only)
        env:
          KOGANY_RIG_DIR: ${{ runner.temp }}/kogany-rig
          HAWKEYE_REGTEST_PORT: "29880"
          HAWKEYE_REGTEST_DIR: ${{ runner.temp }}/hawkeye-regtest
        run: |
          export HAWKEYE_REGTEST_YCASHD="$YCASHD"
          python3 devnet/kogany-rig.py --dir "$KOGANY_RIG_DIR" follow --koganyd "$KOGANYD" \
            --peer-p2p "$HAWKEYE_REGTEST_PORT" --peer-rpc "http://127.0.0.1:$((HAWKEYE_REGTEST_PORT + 1))/" --vault 110 -- \
            cargo test --locked -p hawkeye --test regtest_self_signing -- --nocapture
      - name: upload the rig logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hawkeye-kogany-logs
          path: |
            ${{ runner.temp }}/kogany-rig/*.log
            ${{ runner.temp }}/kogany-rig/*.json
          retention-days: 14
          if-no-files-found: ignore
