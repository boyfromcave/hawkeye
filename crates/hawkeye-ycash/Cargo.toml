[package]
name = "hawkeye-ycash"
description = "Hawkeye's ycashd adapter: a typed JSON-RPC client for the vault primitive's set_*/vault_* RPCs and the stock RPCs, a v4 transaction codec, and a mock ycashd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-process mock ycashd (`hawkeye_ycash::mock`) for this crate's and other crates' tests.
mock = ["dep:axum"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
base64 = "=0.22.1"
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["net", "rt", "sync", "time", "macros", "fs"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "fs"] }

[lints]
workspace = true

[[test]]
name = "client_mock"
required-features = ["mock"]
