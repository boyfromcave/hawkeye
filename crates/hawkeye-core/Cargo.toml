[package]
name = "hawkeye-core"
description = "Hawkeye's pure encodings: vault templates, set signatures, EIP-712, memo and recipient codecs, lock policy, intent matching, leader schedule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake2b_simd = "=1.0.5"
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
ripemd = "=0.1.3"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
thiserror = "=2.0.17"

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[lints]
workspace = true
