[package]
name = "hawkeye"
description = "Hawkeye, the wYEC bridge attestor: engine (plan §5), daemon, status API and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hawkeye"
path = "src/lib.rs"

[[bin]]
name = "hawkeye"
path = "src/main.rs"

[dependencies]
hawkeye-core = { path = "../hawkeye-core" }
hawkeye-eth = { path = "../hawkeye-eth" }
hawkeye-store = { path = "../hawkeye-store" }
hawkeye-ycash = { path = "../hawkeye-ycash" }
alloy = { version = "=2.5.0", default-features = false, features = [
    "std",
    "consensus",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "signer-keystore",
    "sol-types",
] }
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.17"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std", "ansi"] }

[dev-dependencies]
hawkeye-ycash = { path = "../hawkeye-ycash", features = ["mock"] }
alloy = { version = "=2.5.0", default-features = false, features = ["node-bindings"] }
tempfile = "=3.27.0"

[lints]
workspace = true
