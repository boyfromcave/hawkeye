[package]
name = "hawkeye-eth"
description = "Hawkeye's Ethereum adapter: wYEC bindings, finalized-block event scanner, EIP-712 signer, mint submitter (threshold and optimistic), guardian-set reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy = { version = "=2.5.0", default-features = false, features = [
    "std",
    "contract",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "sol-types",
    "json",
    "reqwest",
    "reqwest-rustls-tls",
] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
tokio = { version = "=1.53.2", features = ["time"] }

[dev-dependencies]
alloy = { version = "=2.5.0", default-features = false, features = ["node-bindings"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
