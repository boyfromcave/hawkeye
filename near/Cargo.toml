[package]
name = "wyec-near"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/boyfromcave/hawkeye"
description = "Wrapped Ycash (wYEC) on NEAR: NEP-141 token and Hawkeye bridge policy (hawkeye-near-plan.md §3)"
publish = false

# Standalone: the parent Hawkeye workspace must not pick this crate up.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["unstable"] }
near-contract-standards = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unstable", "unit-testing"] }
k256 = { version = "=0.13.4", features = ["ecdsa"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
serde_json = "=1.0.151"
anyhow = "=1.0.104"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread"] }
# No `install` feature: building must not download the sandbox binary (S3 is unreachable here);
# the sandbox tests are skipped unless NEAR_SANDBOX=1 (tests/sandbox.rs).
near-workspaces = { version = "=0.23.0", default-features = false, features = ["rustls"] }

[features]
# CI only: lets near-workspaces download the NEAR sandbox binary for tests/sandbox.rs.
sandbox-install = ["near-workspaces/install"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
