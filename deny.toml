# cargo-deny: advisories (RustSec), licences, duplicate/banned crates, and sources.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore needs an id, a reason, and a date to revisit.
ignore = [
    # paste: proc-macro only (compile time), flagged unmaintained, no vulnerability; pulled in by
    # alloy-primitives with no maintained replacement upstream yet. Revisit at each alloy bump.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via alloy; no known vulnerability (revisit 2027-01)" },
    # crypto-bigint 0.5.5 (k256 0.13.4 scalars, the member-key ECDSA path): timing variability in
    # operations meant to be constant-time, fixed only in 0.7.6, which needs k256 0.14; alloy-signer
    # 2.5.0 (newest) requires k256 ^0.13. Accepted, time-bounded: RFC6979 signing on the operator's
    # host, and sign-once records mean no message is signed twice, so a remote party cannot collect
    # repeated signatures to average a timing signal. osv-scanner.toml carries the same entry.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via k256 0.13 / alloy; no fixed version reachable (revisit 2027-01-22 or at the alloy k256 0.14 bump)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL is never linked: TLS is rustls everywhere.
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
